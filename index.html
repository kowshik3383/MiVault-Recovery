<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MiVault Recovery</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#10141c;color:#edf2fa;font:16px system-ui}main{max-width:1100px;margin:auto;padding:24px}section{background:#1b2230;border:1px solid #354052;border-radius:18px;padding:20px;margin:20px 0}button,input{font:inherit}button{background:#8ab4ff;color:#10141c;border:0;border-radius:10px;padding:12px;cursor:pointer}button:disabled{opacity:.4}input{max-width:100%;margin:8px 0}input[type=text]{display:block;width:100%;padding:12px;background:#10141c;color:white;border:1px solid #586477;border-radius:8px}#gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}article{min-width:0;background:#1b2230;padding:8px;border-radius:12px}article img,article video{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px}article p{overflow-wrap:anywhere;font-size:12px}dialog{background:#10141c;color:white;border:1px solid #586477;max-width:95vw}dialog img,dialog video{max-width:85vw;max-height:75vh}progress{width:100%}a{color:#8ab4ff}label{display:block}small{color:#b6c2d4}
</style><main><h1>MiVault Recovery</h1><p>Recover your own media locally. No uploads or accounts.</p><section><label>Choose backup folder <input id="folder" type="file" webkitdirectory multiple></label><label>Recovery key (32 hexadecimal characters)<input id="key" type="text" autocomplete="off" spellcheck="false"></label><label>Initial counter (32 hexadecimal characters)<input id="counter" type="text" autocomplete="off" spellcheck="false"></label><label>Video encrypted prefix in bytes <input id="prefix" type="number" min="0" value="1024"></label><button id="run">Recover files</button> <button id="clear">Clear session</button><p><small>Requires the correct key and counter from your authorized backup. Format compatibility is not guaranteed.</small></p><progress id="progress" value="0" max="1"></progress><p id="status" role="status"></p></section><section><button id="all" disabled>Download all ZIP</button> <button id="selected" disabled>Download selected ZIP</button> <select id="filter"><option value="all">All media</option><option value="image">Photos</option><option value="video">Videos</option></select></section><div id="gallery"></div><ul id="errors"></ul><dialog id="viewer"><button id="close">Close</button><div id="preview"></div></dialog></main>
<script type="module">
const $=id=>document.getElementById(id);let items=[],busy=false;
const hex=s=>{if(!/^[0-9a-f]{32}$/i.test(s))throw Error('Enter a valid 16-byte hexadecimal value');return Uint8Array.from(s.match(/../g),x=>parseInt(x,16))};
function format(b){const ascii=(a,z)=>String.fromCharCode(...b.slice(a,z));if(b[0]===255&&b[1]===216&&b[2]===255)return ['jpg','image/jpeg'];if(b[0]===137&&ascii(1,4)==='PNG')return ['png','image/png'];if(ascii(0,4)==='RIFF'&&ascii(8,12)==='WEBP')return ['webp','image/webp'];if(ascii(4,8)==='ftyp'){if(['heic','heix','mif1'].includes(ascii(8,12)))return ['heic','image/heic'];return ['mp4','video/mp4']}throw Error('Unrecognized media signature; check key and format')}
function reset(){ $('viewer').close();$('preview').replaceChildren();for(const i of items)URL.revokeObjectURL(i.url);items=[];$('gallery').replaceChildren();$('errors').replaceChildren();$('all').disabled=$('selected').disabled=true}
function render(){ $('gallery').replaceChildren();for(const i of items){if($('filter').value!=='all'&&!i.type.startsWith($('filter').value))continue;const card=document.createElement('article'),media=document.createElement(i.type.startsWith('video')?'video':'img');media.src=i.url;media.loading='lazy';media.onclick=()=>{const v=media.cloneNode();if(v.tagName==='VIDEO')v.controls=true;$('preview').replaceChildren(v);$('viewer').showModal()};const check=document.createElement('input');check.type='checkbox';check.checked=i.selected;check.setAttribute('aria-label','Select '+i.name);check.onchange=()=>i.selected=check.checked;const p=document.createElement('p');p.textContent=i.name;const a=document.createElement('a');a.href=i.url;a.download=i.name;a.textContent='Download';card.append(media,check,p,a);$('gallery').append(card)}$('all').disabled=$('selected').disabled=!items.length}
$('run').onclick=async()=>{if(busy)return;busy=true;$('run').disabled=$('clear').disabled=true;reset();try{const key=await crypto.subtle.importKey('raw',hex($('key').value),'AES-CTR',false,['decrypt']),counter=hex($('counter').value);const files=[...$('folder').files].filter(f=>/\.lsav?$/i.test(f.name));$('progress').max=files.length||1;$('progress').value=0;for(const [index,f] of files.entries()){try{const video=/\.lsav$/i.test(f.name),n=video?Math.min(f.size,Number($('prefix').value)):f.size;if(!Number.isSafeInteger(n)||n<0)throw Error('Invalid prefix');const decoded=new Uint8Array(await crypto.subtle.decrypt({name:'AES-CTR',counter,length:128},key,await f.slice(0,n).arrayBuffer()));const [ext,type]=format(decoded);const blob=new Blob([decoded,f.slice(n)],{type});items.push({name:(index+1)+'-'+f.name.replace(/\.lsav?$/i,'.'+ext),type,blob,url:URL.createObjectURL(blob),selected:false})}catch(e){const li=document.createElement('li');li.textContent=f.name+': '+e.message;$('errors').append(li)}$('progress').value=index+1;$('status').textContent=items.length+' recovered / '+(index+1)+' processed';await new Promise(r=>setTimeout(r,0))}if(!files.length)$('status').textContent='No supported files selected';render()}catch(e){$('status').textContent=e.message}finally{busy=false;$('run').disabled=$('clear').disabled=false}};
$('filter').onchange=render;$('close').onclick=()=>$('viewer').close();$('clear').onclick=()=>{if(busy)return;reset();$('folder').value=$('key').value=$('counter').value='';$('status').textContent='Session cleared';$('progress').value=0};
const enc=new TextEncoder();function crc(b){let c=-1;for(const x of b){c^=x;for(let j=0;j<8;j++)c=(c>>>1)^((c&1)?0xedb88320:0)}return(c^-1)>>>0}
async function zip(list){if(!list.length)return;const parts=[],central=[];let offset=0,size=0;if(list.length>65535)throw Error('Too many files for ZIP32');for(const i of list){const b=new Uint8Array(await i.blob.arrayBuffer()),name=enc.encode(i.name),sum=crc(b);if(offset+b.length+name.length+30>0xffffffff)throw Error('ZIP exceeds 4 GB');const h=new Uint8Array(30+name.length),v=new DataView(h.buffer);v.setUint32(0,0x04034b50,true);v.setUint16(4,20,true);v.setUint16(6,2048,true);v.setUint32(14,sum,true);v.setUint32(18,b.length,true);v.setUint32(22,b.length,true);v.setUint16(26,name.length,true);h.set(name,30);const c=new Uint8Array(46+name.length),w=new DataView(c.buffer);w.setUint32(0,0x02014b50,true);w.setUint16(4,20,true);w.setUint16(6,20,true);w.setUint16(8,2048,true);w.setUint32(16,sum,true);w.setUint32(20,b.length,true);w.setUint32(24,b.length,true);w.setUint16(28,name.length,true);w.setUint32(42,offset,true);c.set(name,46);parts.push(h,b);central.push(c);offset+=h.length+b.length;size+=c.length}if(offset+size+22>0xffffffff)throw Error('ZIP exceeds 4 GB');const end=new Uint8Array(22),v=new DataView(end.buffer);v.setUint32(0,0x06054b50,true);v.setUint16(8,list.length,true);v.setUint16(10,list.length,true);v.setUint32(12,size,true);v.setUint32(16,offset,true);const url=URL.createObjectURL(new Blob([...parts,...central,end],{type:'application/zip'})),a=document.createElement('a');a.href=url;a.download='mivault-recovered.zip';a.click();setTimeout(()=>URL.revokeObjectURL(url),60000)}
async function download(list){try{await zip(list)}catch(e){$('status').textContent=e.message}}$('all').onclick=()=>download(items);$('selected').onclick=()=>download(items.filter(i=>i.selected));
</script></html>
