<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MiVault Recovery</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#10141c;color:#edf2fa;font:16px system-ui}
main{max-width:1100px;margin:auto;padding:24px}
section{background:#1b2230;border:1px solid #354052;border-radius:18px;padding:20px;margin:20px 0}
button,input{font:inherit}
button{background:#8ab4ff;color:#10141c;border:0;border-radius:10px;padding:12px;cursor:pointer}
button:disabled{opacity:.4}
input{max-width:100%;margin:8px 0}
#gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
article{min-width:0;background:#1b2230;padding:8px;border-radius:12px}
article img,article video{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px}
article p{overflow-wrap:anywhere;font-size:12px}
dialog{background:#10141c;color:white;border:1px solid #586477;max-width:95vw}
dialog img,dialog video{max-width:85vw;max-height:75vh}
progress{width:100%}
a{color:#8ab4ff}
label{display:block}
small{color:#b6c2d4}
input[type=file]{display:block;width:100%;color:inherit}
input[type=file]::file-selector-button{font:inherit;margin-right:8px;padding:6px 10px}
.pickers,.actions{display:flex;flex-wrap:wrap;gap:12px}
.pickers label{flex:1 1 260px;min-width:0}
article .thumbnail{display:block;width:100%;padding:0;background:transparent}
article img,article video{display:block}
</style>
</head>
<body>
<main>
  <h1>MiVault Recovery</h1>
  <p>Recover your MIUI Gallery Secret Album photos and videos. Files stay on your device.</p>
  <section aria-label="Recovery">
    <div class="pickers">
      <label for="folder">Choose a folder
        <input id="folder" type="file" webkitdirectory>
      </label>
      <label for="files">Choose files
        <input id="files" type="file" multiple>
      </label>
    </div>
    <p><small>Recovery starts when you select .lsa photos or .lsav videos. For a Gallery build that uses a different key, include your mivault-recovery.json in the same selection.</small></p>
    <div class="actions">
      <button id="run" disabled>Recover files</button>
      <button id="clear">Clear session</button>
    </div>
    <p id="status" role="status"></p>
    <progress id="progress" value="0" max="1" aria-label="Recovery progress"></progress>
    <ul id="errors"></ul>
  </section>
  <section class="actions" aria-label="Gallery controls">
    <button id="all" disabled>Download all ZIP</button>
    <button id="selected" disabled>Download selected ZIP</button>
    <select id="filter" aria-label="Filter recovered media">
      <option value="all">All media</option>
      <option value="image">Photos</option>
      <option value="video">Videos</option>
    </select>
  </section>
  <div id="gallery"></div>
  <dialog id="viewer" aria-label="Recovered media preview">
    <button id="close">Close</button>
    <div id="preview"></div>
  </dialog>
</main>
<script type="module">
const $ = id => document.getElementById(id);
const mediaExtension = /\.lsav?$/i;
const manifestName = 'mivault-recovery.json';

// Parameters for MIUI Gallery Global backups.
// Format reference: https://github.com/Jay-S9/miui-lsa-decryptor#how-it-works
const globalGallery = {
  key: '3082046c30820354a003020102020900',
  counter: '11132123313341435153616667687172',
  videoPrefixBytes: 1024,
};

let batch = [];
let items = [];
let busy = false;

function hex(value, field) {
  if (typeof value !== 'string' || !/^[0-9a-f]{32}$/i.test(value)) {
    throw new Error('The recovery manifest needs a 16-byte hexadecimal ' + field + '.');
  }
  return Uint8Array.from(value.match(/../g), byte => parseInt(byte, 16));
}

async function recoveryParameters(files) {
  const manifests = files.filter(file => file.name.toLowerCase() === manifestName);
  if (manifests.length > 1) {
    throw new Error('Select only one ' + manifestName + ' per batch.');
  }

  let parameters = globalGallery;
  if (manifests.length) {
    try {
      parameters = JSON.parse(await manifests[0].text());
    } catch {
      throw new Error('Could not read ' + manifestName + ' as JSON.');
    }
    if (!parameters || typeof parameters !== 'object' || Array.isArray(parameters)) {
      throw new Error('The recovery manifest must contain a JSON object.');
    }
  }

  const keyBytes = hex(parameters.key, 'key');
  const counter = hex(parameters.counter, 'counter');
  const videoPrefixBytes = Number(parameters.videoPrefixBytes ?? globalGallery.videoPrefixBytes);
  if (!Number.isSafeInteger(videoPrefixBytes) || videoPrefixBytes < 0) {
    throw new Error('The recovery manifest has an invalid videoPrefixBytes value.');
  }
  const key = await crypto.subtle.importKey('raw', keyBytes, 'AES-CTR', false, ['decrypt']);
  return { key, counter, videoPrefixBytes };
}

function mediaFormat(bytes) {
  const ascii = (start, end) => String.fromCharCode(...bytes.subarray(start, end));
  const brand = ascii(8, 12);
  if (bytes[0] === 255 && bytes[1] === 216 && bytes[2] === 255) return ['jpg', 'image/jpeg'];
  if (bytes[0] === 137 && ascii(1, 8) === 'PNG\r\n\x1a\n') return ['png', 'image/png'];
  if (ascii(0, 4) === 'RIFF' && brand === 'WEBP') return ['webp', 'image/webp'];
  if (['GIF87a', 'GIF89a'].includes(ascii(0, 6))) return ['gif', 'image/gif'];
  if (ascii(4, 8) === 'ftyp') {
    if (['heic', 'heix', 'hevc', 'hevx', 'mif1', 'msf1'].includes(brand)) {
      return ['heic', 'image/heic'];
    }
    if (['avif', 'avis'].includes(brand)) return ['avif', 'image/avif'];
    if (brand === 'qt  ') return ['mov', 'video/quicktime'];
    return ['mp4', 'video/mp4'];
  }
  throw new Error('Could not recognize the recovered media. The file may be damaged or use a different Gallery key.');
}

async function recoverFile(file, index, { key, counter, videoPrefixBytes }) {
  const isVideo = /\.lsav$/i.test(file.name);
  const prefixLength = isVideo ? Math.min(file.size, videoPrefixBytes) : file.size;
  const encrypted = await file.slice(0, prefixLength).arrayBuffer();
  const decrypted = new Uint8Array(await crypto.subtle.decrypt(
    { name: 'AES-CTR', counter, length: 128 }, key, encrypted
  ));
  const [extension, type] = mediaFormat(decrypted);
  const blob = new Blob([decrypted, file.slice(prefixLength)], { type });
  const name = (index + 1) + '-' + file.name.replace(mediaExtension, '.' + extension);
  return { name, type, blob, url: URL.createObjectURL(blob), selected: false };
}

function clearResults() {
  $('viewer').close();
  $('preview').replaceChildren();
  for (const item of items) URL.revokeObjectURL(item.url);
  items = [];
  $('gallery').replaceChildren();
  $('errors').replaceChildren();
  $('progress').max = 1;
  $('progress').value = 0;
  updateDownloadButtons();
}

function updateDownloadButtons() {
  $('all').disabled = !items.length;
  $('selected').disabled = !items.some(item => item.selected);
}

function renderGallery() {
  const filter = $('filter').value;
  const cards = document.createDocumentFragment();
  for (const item of items) {
    if (filter !== 'all' && !item.type.startsWith(filter)) continue;

    const card = document.createElement('article');
    const isVideo = item.type.startsWith('video');
    const media = document.createElement(isVideo ? 'video' : 'img');
    media.src = item.url;
    if (isVideo) {
      media.preload = 'metadata';
      media.muted = true;
    } else {
      media.loading = 'lazy';
      media.alt = item.name;
    }

    const thumbnail = document.createElement('button');
    thumbnail.className = 'thumbnail';
    thumbnail.setAttribute('aria-label', 'Preview ' + item.name);
    thumbnail.append(media);
    thumbnail.onclick = () => {
      const preview = media.cloneNode();
      if (isVideo) {
        preview.controls = true;
        preview.muted = false;
      }
      $('preview').replaceChildren(preview);
      $('viewer').showModal();
    };

    const checkbox = document.createElement('input');
    checkbox.type = 'checkbox';
    checkbox.checked = item.selected;
    checkbox.setAttribute('aria-label', 'Select ' + item.name);
    checkbox.onchange = () => {
      item.selected = checkbox.checked;
      updateDownloadButtons();
    };

    const label = document.createElement('p');
    label.textContent = item.name;
    const link = document.createElement('a');
    link.href = item.url;
    link.download = item.name;
    link.textContent = 'Download';
    card.append(thumbnail, checkbox, label, link);
    cards.append(card);
  }
  $('gallery').replaceChildren(cards);
  updateDownloadButtons();
}

function setBusy(value) {
  busy = value;
  $('run').disabled = value || !batch.some(file => mediaExtension.test(file.name));
  $('clear').disabled = value;
  $('folder').disabled = value;
  $('files').disabled = value;
}

async function recoverBatch() {
  if (busy) return;
  setBusy(true);
  clearResults();
  try {
    const files = batch.filter(file => mediaExtension.test(file.name));
    if (!files.length) {
      $('status').textContent = 'No .lsa or .lsav files found in this selection.';
      return;
    }
    if (!globalThis.crypto?.subtle) {
      throw new Error('Open MiVault Recovery over HTTPS or on localhost to decrypt files.');
    }

    $('progress').max = files.length;
    $('status').textContent = 'Recovering ' + files.length + ' file(s)…';
    const parameters = await recoveryParameters(batch);
    for (const [index, file] of files.entries()) {
      try {
        items.push(await recoverFile(file, index, parameters));
      } catch (error) {
        const entry = document.createElement('li');
        entry.textContent = (file.webkitRelativePath || file.name) + ': ' + error.message;
        $('errors').append(entry);
      }
      $('progress').value = index + 1;
    }
    const failed = files.length - items.length;
    $('status').textContent = items.length + ' of ' + files.length + ' recovered' +
      (failed ? ' · ' + failed + ' failed.' : '.');
    renderGallery();
  } catch (error) {
    $('status').textContent = error.message;
  } finally {
    setBusy(false);
  }
}

function handleSelection(event) {
  const input = event.currentTarget;
  const files = Array.from(input.files);
  input.value = '';
  if (!files.length || busy) return;
  batch = files;
  void recoverBatch();
}

$('folder').onchange = handleSelection;
$('files').onchange = handleSelection;
$('run').onclick = recoverBatch;
$('filter').onchange = renderGallery;
$('close').onclick = () => $('viewer').close();
$('viewer').onclose = () => $('preview').replaceChildren();
$('clear').onclick = () => {
  batch = [];
  clearResults();
  setBusy(false);
  $('status').textContent = 'Session cleared.';
};

const enc=new TextEncoder();function crc(b){let c=-1;for(const x of b){c^=x;for(let j=0;j<8;j++)c=(c>>>1)^((c&1)?0xedb88320:0)}return(c^-1)>>>0}
async function zip(list){if(!list.length)return;const parts=[],central=[];let offset=0,size=0;if(list.length>65535)throw Error('Too many files for ZIP32');for(const i of list){const b=new Uint8Array(await i.blob.arrayBuffer()),name=enc.encode(i.name),sum=crc(b);if(offset+b.length+name.length+30>0xffffffff)throw Error('ZIP exceeds 4 GB');const h=new Uint8Array(30+name.length),v=new DataView(h.buffer);v.setUint32(0,0x04034b50,true);v.setUint16(4,20,true);v.setUint16(6,2048,true);v.setUint32(14,sum,true);v.setUint32(18,b.length,true);v.setUint32(22,b.length,true);v.setUint16(26,name.length,true);h.set(name,30);const c=new Uint8Array(46+name.length),w=new DataView(c.buffer);w.setUint32(0,0x02014b50,true);w.setUint16(4,20,true);w.setUint16(6,20,true);w.setUint16(8,2048,true);w.setUint32(16,sum,true);w.setUint32(20,b.length,true);w.setUint32(24,b.length,true);w.setUint16(28,name.length,true);w.setUint32(42,offset,true);c.set(name,46);parts.push(h,b);central.push(c);offset+=h.length+b.length;size+=c.length}if(offset+size+22>0xffffffff)throw Error('ZIP exceeds 4 GB');const end=new Uint8Array(22),v=new DataView(end.buffer);v.setUint32(0,0x06054b50,true);v.setUint16(8,list.length,true);v.setUint16(10,list.length,true);v.setUint32(12,size,true);v.setUint32(16,offset,true);const url=URL.createObjectURL(new Blob([...parts,...central,end],{type:'application/zip'})),a=document.createElement('a');a.href=url;a.download='mivault-recovered.zip';a.click();setTimeout(()=>URL.revokeObjectURL(url),60000)}
async function download(list){try{await zip(list)}catch(e){$('status').textContent=e.message}}$('all').onclick=()=>download(items);$('selected').onclick=()=>download(items.filter(i=>i.selected));
</script>
</body>
</html>
